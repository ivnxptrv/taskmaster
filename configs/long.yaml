programs:
  sleeper:
    cmd: "/usr/bin/sleep 60"
    numprocs: 2
    umask: 022
    workingdir: /tmp
    autostart: true
    autorestart: never
    exitcodes:
      - 0
    startretries: 3
    starttime: 1
    stopsignal: TERM
    stoptime: 3
    stdout: /tmp/taskmaster-sleeper.out
    stderr: /tmp/taskmaster-sleeper.err
